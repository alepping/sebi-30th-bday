<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>…</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0c">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0; height:100%}
  body.gate{background:#0a0a0c}
  body{background:#e9f3e4; transition:background .8s; display:grid; place-items:center; min-height:100svh; overflow:hidden; -webkit-tap-highlight-color:transparent; font-family:"Fraunces",Georgia,serif}
  .stage{position:relative; width:min(72vw,300px); aspect-ratio:300/380; cursor:pointer; user-select:none}
  svg{width:100%; height:100%; display:block; overflow:visible}
  .shadow{transition:transform .5s}
  .egg{transform-origin:150px 340px}
  .wobble .egg{animation:wobble .45s ease-in-out}
  @keyframes wobble{0%{transform:rotate(0)} 25%{transform:rotate(-7deg) scale(1.02,.98)} 55%{transform:rotate(6deg) scale(.98,1.03)} 80%{transform:rotate(-3deg)} 100%{transform:rotate(0)}}
  .crack1,.crack2{opacity:0; transition:opacity .15s}
  [data-stage="1"] .crack1,[data-stage="2"] .crack1,[data-stage="2"] .crack2{opacity:1}
  .top{transform-origin:150px 180px; transition:transform .7s cubic-bezier(.2,.8,.2,1.1), opacity .6s}
  .face{opacity:0; transform:translateY(150px); transition:transform .8s cubic-bezier(.2,.8,.2,1.15) .15s, opacity .4s .15s}
  [data-stage="3"] .top{transform:translate(-125px,-165px) rotate(-55deg); opacity:.98}
  [data-stage="3"] .face{opacity:1; transform:translateY(0); animation:bob 3s ease-in-out 1.2s infinite}
  @keyframes bob{50%{transform:translateY(-6px)}}
  [data-stage="3"] .crack1,[data-stage="3"] .crack2{opacity:0}
  .bubble{position:absolute; left:74%; top:-2.6rem; transform:translate(-50%,10px) scale(.6); opacity:0; background:#fff; color:#2b2b2b; border:3px solid #2b2b2b; border-radius:1.2rem; padding:.55rem 1rem; font-style:italic; font-size:clamp(1.3rem,6vw,1.8rem); white-space:nowrap; transition:transform .5s cubic-bezier(.2,.8,.2,1.3) .7s, opacity .3s .7s; pointer-events:none}
  .bubble::after{content:""; position:absolute; left:50%; bottom:-14px; width:18px; height:18px; background:#fff; border-right:3px solid #2b2b2b; border-bottom:3px solid #2b2b2b; transform:translateX(-50%) rotate(45deg)}
  [data-stage="3"] .bubble{opacity:1; transform:translate(-50%,0) scale(1)}
  /* ---- the gate ---- */
  .gate .stage,.gate .peek,.pre .stage,.pre .peek{display:none}
  body.pre{background:#0a0a0c}
  #pre{display:none; color:#d9d6cf; text-align:center; padding:2rem 1.25rem; max-width:22rem}
  .pre #pre{display:block}
  #pre p{font-style:italic; font-size:clamp(1.25rem,5.5vw,1.6rem); line-height:1.45; margin:0 0 1.75rem}
  #pre button{font:inherit; font-size:1.05rem; font-style:italic; background:transparent; color:#d9d6cf; border:1px solid #6b6880; border-radius:999px; padding:.7rem 1.6rem; cursor:pointer}
  .figure{cursor:pointer; transition:transform .3s}
  .gate:not(.asked) .figure{animation:breathe 4s ease-in-out infinite}
  @keyframes breathe{50%{transform:translateY(-6px) scale(1.02)}}
  .figure:active{transform:scale(.97)}
  #gate p,#gate form,#gate .no{opacity:0; transform:translateY(8px); transition:opacity .6s .15s, transform .6s .15s; pointer-events:none}
  .asked #gate p,.asked #gate form,.asked #gate .no{opacity:1; transform:none; pointer-events:auto}
  #gate{display:none; color:#d9d6cf; text-align:center; padding:2rem 1.25rem; max-width:24rem}
  .gate #gate{display:block}
  .figure{width:min(52vw,190px); margin:0 auto 1.5rem; filter:drop-shadow(0 0 30px rgba(180,170,255,.18))}
  .eyes{animation:blink 5s infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)} 95%{transform:scaleY(.05)}}
  .eyes circle{transform-origin:center}
  #gate p{font-style:italic; font-size:clamp(1.25rem,5.5vw,1.6rem); line-height:1.45; margin:0 0 1.5rem}
  #gate form{display:flex; gap:.5rem; justify-content:center}
  #gate input{width:7rem; font:inherit; font-size:1.6rem; text-align:center; background:transparent; color:#fff; border:0; border-bottom:2px solid #6b6880; padding:.3rem 0; outline:none; border-radius:0}
  #gate input:focus{border-color:#d9d6cf}
  #gate input{-moz-appearance:textfield; appearance:textfield}
  #gate input::-webkit-outer-spin-button,#gate input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
  #gate button{font:inherit; font-size:1rem; font-style:italic; background:transparent; color:#d9d6cf; border:1px solid #6b6880; border-radius:999px; padding:.5rem 1.1rem; cursor:pointer}
  #gate .no{min-height:1.6rem; margin-top:1rem; font-style:italic; color:#a09cb3}
  #gate .no{visibility:hidden}
  #gate .no.on{visibility:visible}
  .peek{position:fixed; inset:0; background:#000; display:none; place-items:center; z-index:9}
  .peek.on{display:grid}
  .peek img{max-width:100%; max-height:100%; object-fit:contain}
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01s !important; animation:none !important}}
</style>
</head>
<body class="pre">
  <div id="pre">
    <p>Is your sound on?</p>
    <button type="button" id="continue">Continue</button>
  </div>
  <div id="gate">
    <svg class="figure" id="figure" viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg" role="button" aria-label="A hooded figure. Tap it.">
      <path d="M100 8 C62 8 44 46 40 80 C36 116 24 150 18 200 L10 252 L190 252 L182 200 C176 150 164 116 160 80 C156 46 138 8 100 8Z" fill="#17161c"/>
      <path d="M100 30 C78 30 66 58 66 86 C66 112 80 130 100 130 C120 130 134 112 134 86 C134 58 122 30 100 30Z" fill="#050508"/>
      <g class="eyes"><circle cx="86" cy="92" r="4" fill="#e8dcff"/><circle cx="114" cy="92" r="4" fill="#e8dcff"/></g>
      <path d="M40 240 C60 220 140 220 160 240" stroke="#0a0a0c" stroke-width="3" fill="none"/>
    </svg>
    <p>I picked a number<br>between <span style="white-space:nowrap">1 and 100</span>.<br>Which one is it?</p>
    <form id="ask" autocomplete="off">
      <input id="num" type="number" inputmode="numeric" min="1" max="100" placeholder="?" required aria-label="Your guess">
      <button type="submit">Tell me</button>
    </form>
    <div class="no" id="no"></div>
  </div>
  <div class="stage" id="stage" data-stage="0" role="button" aria-label="An egg. Tap it.">
    <div class="bubble">Oh Behbi&rsquo;</div>
    <svg viewBox="0 0 300 380" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <path id="eggPath" d="M150 22 C232 22 276 128 276 218 C276 306 222 358 150 358 C78 358 24 306 24 218 C24 128 68 22 150 22Z"/>
        <clipPath id="eggClip"><use href="#eggPath"/></clipPath>
        <clipPath id="topClip"><polygon points="0,0 300,0 300,180 262,198 228,170 196,200 162,168 130,200 98,170 66,198 34,174 0,192"/></clipPath>
        <clipPath id="botClip"><polygon points="0,190 34,172 66,196 98,168 130,198 162,166 196,198 228,168 262,196 300,178 300,380 0,380"/></clipPath>
        <radialGradient id="fade" cx=".5" cy=".5" r=".5"><stop offset=".68" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
        <mask id="faceMask" maskUnits="userSpaceOnUse" x="0" y="0" width="300" height="380"><ellipse cx="150" cy="135" rx="125" ry="160" fill="url(#fade)"/></mask>
        <radialGradient id="shade" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fff"/><stop offset=".7" stop-color="#f4f4ee"/><stop offset="1" stop-color="#d7d9cf"/></radialGradient>
        <g id="eggBody">
          <use href="#eggPath" fill="url(#shade)"/>
          <g clip-path="url(#eggClip)" fill="#4cbb4a" stroke="#2f8f33" stroke-width="3">
            <circle cx="92" cy="96" r="24"/><circle cx="178" cy="66" r="18"/><circle cx="228" cy="150" r="27"/>
            <circle cx="120" cy="190" r="22"/><circle cx="60" cy="224" r="20"/><circle cx="196" cy="234" r="25"/>
            <circle cx="122" cy="300" r="26"/><circle cx="224" cy="300" r="17"/><circle cx="70" cy="320" r="14"/>
          </g>
          <ellipse cx="96" cy="88" rx="30" ry="46" fill="#fff" opacity=".55" transform="rotate(25 96 88)"/>
          <use href="#eggPath" fill="none" stroke="#2b2b2b" stroke-width="5"/>
        </g>
      </defs>
      <ellipse class="shadow" cx="150" cy="362" rx="95" ry="12" fill="#000" opacity=".12"/>
      <g class="egg">
        <!-- face inside the egg -->
        <g class="face">
          <image href="assets/egg-face.png" x="20" y="-58" width="260" height="322" preserveAspectRatio="xMidYMid meet" mask="url(#faceMask)"/>
        </g>
        <!-- bottom shell (in front of the face's lower half) -->
        <g class="bot" clip-path="url(#botClip)"><use href="#eggBody"/></g>
        <!-- top shell -->
        <g class="top" clip-path="url(#topClip)"><use href="#eggBody"/></g>
        <!-- cracks -->
        <g fill="none" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <path class="crack1" d="M128 150 l14 14 -10 16 18 12 -6 18"/>
          <path class="crack2" d="M142 164 l22 -10 12 14 20 -6 M132 180 l-22 8 -12 -14 -18 6 M150 192 l20 12 -4 18 M110 200 l-14 22"/>
        </g>
      </g>
    </svg>
  </div>
  <audio id="boss" loop preload="auto" playsinline><source src="assets/last_dance.mp3?v=2" type="audio/mpeg"></audio>
  <div class="peek" id="peek"><img src="assets/egg-original.jpg?v=2" alt="The whole picture."></div>
<script>
  /* ---- final boss music: autoplay if allowed, else on first interaction ---- */
  const boss = document.getElementById('boss');
  boss.volume = .7;
  let musicOn = false;
  function startMusic(){
    if (musicOn) return;
    if (boss.error || boss.networkState === 3) boss.load();   // e.g. a cached 404 from earlier
    const p = boss.play();
    if (p && p.then) p.then(() => { musicOn = true; }).catch(() => {});
  }
  // 1. "sound on?" -> the fight (figure only). Use the tap to unlock audio for later.
  document.getElementById('continue').addEventListener('click', () => {
    document.body.classList.remove('pre'); document.body.classList.add('gate');
    const p = boss.play(); if (p && p.then) p.then(() => { boss.pause(); boss.currentTime = 0; }).catch(() => {});
  });
  // 2. tap the figure -> the question, and the music
  document.getElementById('figure').addEventListener('click', () => {
    if (document.body.classList.contains('asked')) return;
    document.body.classList.add('asked');
    startMusic();
    setTimeout(() => num.focus(), 400);
  });
  function fadeMusic(){
    const t = setInterval(() => { boss.volume = Math.max(0, boss.volume - .05); if (boss.volume === 0){ boss.pause(); clearInterval(t); } }, 120);
  }
  const ask = document.getElementById('ask'), num = document.getElementById('num'), no = document.getElementById('no');
  ask.addEventListener('submit', e => {
    e.preventDefault();
    const n = parseInt(num.value, 10);
    if ((n * 7919) % 1000 === 3){
      document.body.classList.remove('gate');
      document.querySelector('meta[name=theme-color]').setAttribute('content', '#e9f3e4');
      fadeMusic();
    } else {
      no.textContent = 'No.'; no.classList.add('on');
      ask.querySelector('button').disabled = true;
      setTimeout(() => location.replace('./'), 900);
    }
  });
  const stage = document.getElementById('stage'), peek = document.getElementById('peek');
  const pre = new URLSearchParams(location.search).get('stage'); if (pre !== null){ stage.dataset.stage = Math.min(3, +pre); document.body.classList.remove('gate','pre'); }
  stage.addEventListener('click', e => {
    const s = +stage.dataset.stage;
    if (s < 3){
      stage.dataset.stage = s + 1;
      stage.classList.remove('wobble'); void stage.offsetWidth; stage.classList.add('wobble');
      if (navigator.vibrate) navigator.vibrate(s === 2 ? [30,40,60] : 25);
    } else if (e.target.closest('.face')) {
      peek.classList.add('on');
    }
  });
  peek.addEventListener('click', () => peek.classList.remove('on'));
</script>
</body>
</html>
