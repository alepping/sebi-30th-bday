<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sebi wird 30</title>
<meta name="description" content="Sebi wird 30 – alle Infos folgen hier.">
<meta name="theme-color" content="#12100e">
<style>
  :root{
    --bg:#12100e; --ink:#f6f1e7; --muted:#a89f91; --accent:#e8b04b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:ui-serif,Georgia,"Times New Roman",serif;
    min-height:100svh; display:grid; place-items:center;
    padding:2rem 1.25rem; text-align:center;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:34rem}
  .kicker{
    font-family:ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",sans-serif;
    text-transform:uppercase; letter-spacing:.28em; font-size:.7rem;
    color:var(--accent); margin:0 0 1.5rem;
  }
  h1{
    font-size:clamp(2.75rem,13vw,5rem); line-height:.95; margin:0;
    font-weight:400; letter-spacing:-.02em;
  }
  h1 .thirty{display:block; color:var(--accent); font-size:1.3em; margin-top:.1em}
  .rule{width:3rem; height:1px; background:var(--muted); opacity:.5; margin:2rem auto}
  p{
    font-family:ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",sans-serif;
    color:var(--muted); font-size:1rem; line-height:1.7; margin:0;
  }
  .soon{margin-top:1rem; font-size:.85rem; letter-spacing:.08em; opacity:.7}
</style>
</head>
<body>
  <main class="wrap">
    <p class="kicker">Save the date</p>
    <h1>Sebi wird<span class="thirty">30</span></h1>
    <div class="rule"></div>
    <p>Alle Infos zur Feier &mdash; Wann, Wo und alles Weitere &mdash; findest du hier.</p>
    <p class="soon">Diese Seite wird noch gef&uuml;llt.</p>
  </main>
</body>
</html>
